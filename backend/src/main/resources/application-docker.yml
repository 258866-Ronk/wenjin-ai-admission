spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:postgres}:${POSTGRES_PORT:5432}/${POSTGRES_DB:wenjin}
    username: ${POSTGRES_USER:wenjin}
    password: ${POSTGRES_PASSWORD:wenjin_dev}
  flyway:
    locations: classpath:db/migration/common,classpath:db/migration/postgresql

management:
  health:
    redis:
      enabled: true

app:
  workflow:
    redis-queue-enabled: true
