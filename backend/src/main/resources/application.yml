spring:
  application:
    name: wenjin-backend
  datasource:
    url: jdbc:h2:file:./.local/wenjin;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration/common
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 600ms
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: never
    include-stacktrace: never

management:
  health:
    redis:
      enabled: false
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  auth:
    session-hours: 72
    secure-cookie: ${SESSION_SECURE_COOKIE:false}
  ai:
    mode: ${AI_MODE:mock}
    provider: ${AI_PROVIDER:openai-compatible}
    base-url: ${AI_BASE_URL:https://api.openai.com/v1}
    api-key: ${AI_API_KEY:}
    chat-model: ${AI_CHAT_MODEL:}
    fast-model: ${AI_FAST_MODEL:}
    embedding-model: ${AI_EMBEDDING_MODEL:}
    timeout-seconds: ${AI_TIMEOUT_SECONDS:60}
    max-retries: ${AI_MAX_RETRIES:2}
    max-output-tokens: ${AI_MAX_OUTPUT_TOKENS:2048}
    config-encryption-key: ${AI_CONFIG_ENCRYPTION_KEY:}
    config-key-path: ${AI_CONFIG_KEY_PATH:./.local/ai-config.key}
  workflow:
    executor-threads: 4
    event-retention: 500
    redis-queue-enabled: ${REDIS_JOB_QUEUE_ENABLED:false}
  importer:
    demo-path: ${DEMO_DATA_PATH:classpath:demo/demo-admissions.json}
    demo-supplement-path: ${DEMO_SUPPLEMENT_DATA_PATH:classpath:demo/demo-fujian-admissions.json}
    seed-enabled: ${DEMO_SEED_ENABLED:true}

logging:
  pattern:
    console: '{"timestamp":"%d{yyyy-MM-dd''T''HH:mm:ss.SSSXXX}","level":"%p","traceId":"%X{traceId}","logger":"%logger{36}","message":"%replace(%m){''[\r\n]'','' ''}"}%n'
  level:
    root: INFO
    cn.wenjin: INFO
